[project]
name = "actual-careerlab"
version = "0.1.0"
description = "Offline synthetic CareerLab fixtures and integrity checks for ACTUAL Phase 1"
requires-python = ">=3.13,<3.15"
dependencies = []

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
careerlab = "actual.careerlab.__main__:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10", "mypy==2.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests/careerlab"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers --basetemp=.pytest-tmp-careerlab"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
files = ["src"]
