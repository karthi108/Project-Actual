[project]
name = "actual-careerlab"
version = "0.1.0"
description = "ACTUAL synthetic Career boundaries and evidence-backed Job Intelligence"
requires-python = ">=3.13,<3.15"
dependencies = [
    "pydantic==2.13.5",
    "SQLAlchemy==2.1.3",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "fastapi==0.142.2",
    "uvicorn==0.53.0",
    "httpx2==2.13.1",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
careerlab = "actual.careerlab.__main__:main"
actual-api = "actual.api.__main__:main"
actual-model-probe = "actual.models.__main__:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10", "mypy==2.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests/careerlab", "tests/core", "tests/profile", "tests/persistence", "tests/application", "tests/api", "tests/models", "tests/intelligence"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers --basetemp=.pytest-tmp-careerlab"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
files = ["src", "migrations", "scripts/verify_phase5_live.py", "scripts/evaluate_phase6_live.py", "scripts/evaluate_phase6a_live.py", "scripts/phase6_journal.py", "scripts/phase6_monitor.py", "scripts/phase6_cleanup.py", "scripts/phase6a_results.py", "scripts/audit_phase6_provenance.py", "scripts/verify_phase7_profile.py"]
