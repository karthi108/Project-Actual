[project]
name = "actual-careerlab"
version = "0.1.0"
description = "ACTUAL synthetic Career HTTP boundary, domain contracts and PostgreSQL persistence"
requires-python = ">=3.13,<3.15"
dependencies = [
    "pydantic==2.13.5",
    "SQLAlchemy==2.1.3",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "fastapi==0.142.2",
    "uvicorn==0.53.0",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
careerlab = "actual.careerlab.__main__:main"
actual-api = "actual.api.__main__:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10", "mypy==2.4.0", "httpx2==2.13.1"]

[tool.pytest.ini_options]
testpaths = ["tests/careerlab", "tests/core", "tests/persistence", "tests/application", "tests/api"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers --basetemp=.pytest-tmp-careerlab"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
files = ["src", "migrations"]
