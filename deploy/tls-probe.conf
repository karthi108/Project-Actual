# Operator-provided certificates; probe only, no forwarding into the unauthenticated API.
pid /tmp/nginx.pid;
events { worker_connections 32; }
http {
  access_log off;
  error_log /dev/stderr warn;
  server {
    listen 127.0.0.1:8443 ssl;
    server_name localhost;
    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_private_key;
    ssl_protocols TLSv1.3;
    location = /health/tls { return 204; }
    location / { return 403; }
  }
}
