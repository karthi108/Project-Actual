name: Provisional ACTUAL checks
on:
  workflow_dispatch:
  push:
    branches: [office/continuous-build]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.13.13", type_target: "3.13"}
          - {python: "3.14.4", type_target: "3.14"}
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: actual_ci_synthetic
          POSTGRES_USER: actual_ci
          # Explicitly fake, disposable service credential; no account secret.
          POSTGRES_PASSWORD: synthetic_ci_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U actual_ci -d actual_ci_synthetic"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      ACTUAL_TEST_DATABASE_URL: postgresql+psycopg://actual_ci:synthetic_ci_only@127.0.0.1:5432/actual_ci_synthetic
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: {python-version: "${{ matrix.python }}"}
      - run: python -m pip install uv==0.11.7
      - run: uv sync --locked --python "${{ matrix.python }}"
      - run: uv run --locked python scripts/prepare_evaluator_fixtures.py --materialize
      - run: uv run --locked python -m ruff check .
      - run: uv run --locked python -m ruff format --check src tests migrations scripts
      - run: uv run --locked python -m mypy --python-version "${{ matrix.type_target }}"
      - run: uv run --locked python -m mypy --python-version "${{ matrix.type_target }}" scripts/prepare_evaluator_fixtures.py scripts/office_git_state.py
      - run: uv run --locked python -m pytest -q
      - run: uv run --locked python -m actual.careerlab verify --manifest docs/office-build/careerlab-environment.json
      - run: uv run --locked python scripts/verify_frozen_artifacts.py
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: "24.19.0"}
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm build
# CI is provisional, never an acceptance decision. Browser/Docker/Terraform/cloud,
# live model and retained-source replay remain explicit personal-environment gates.
